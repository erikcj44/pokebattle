<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1b26;--panel:#1a3042;--ink:#e8f1f5;--water:#7fd4ff;--muted:#8fa8b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pixelify Sans',ui-monospace,Menlo,monospace}
body{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:1.4rem;font-weight:700}
p{margin:0;color:var(--muted);font-size:.9rem;text-align:center;max-width:760px;line-height:1.4}
.stage{position:relative;width:min(100%,960px)}
canvas#c{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;border:4px solid var(--panel);background:#000;touch-action:none}
.ov{position:absolute;inset:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(8,16,24,.86);padding:12px;text-align:center}
.ov[hidden]{display:none}
.ov h2{margin:0;font-size:1.5rem}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--panel);border:2px solid #2c4a62;border-radius:6px;cursor:pointer;touch-action:manipulation}
button:hover,button:active,button.on{background:#2c4a62}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}
button[hidden]{display:none}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 14px;width:200px}
.card canvas{width:120px;height:120px;image-rendering:pixelated}
.card small{font-weight:500;color:var(--muted);font-size:.8rem}
.go{padding:10px 18px}
.pad{display:none}body.play h1,body.play p{display:none}body.play{min-height:100vh;justify-content:center}
.dp{display:flex;gap:6px}.dp button{width:60px;height:60px}
.act{display:flex;gap:10px}.act button{width:84px;height:84px;border-radius:50%;background:#1d5b82;border-color:var(--water)}
.ov{overflow:auto;justify-content:flex-start}
.sel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;width:100%;max-width:860px;margin:auto;text-align:left}
.ros h2{margin:0 0 10px}.ros small{display:block;margin-top:10px;color:var(--muted);font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;font-size:.68rem;border-color:#2c4a62}
.tile canvas{width:50px;height:50px;image-rendering:pixelated;border:2px solid #0b1620}
.tile.on{background:#1d5b82;border-color:var(--water);box-shadow:0 0 0 2px var(--water)}
.info{background:#12222f;border:2px solid #2c4a62;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hd{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.hd #pt{width:80px;height:80px;image-rendering:pixelated;border:2px solid #0b1620}
.hd #pv{width:136px;height:112px;image-rendering:pixelated}
.hd h3{margin:0 0 4px;font-size:1.3rem}
.ty{display:inline-block;padding:1px 10px;border-radius:10px;font-size:.8rem;color:#0b1620;font-weight:700}
.ty.Water{background:#6cc3ff}.ty.Fire{background:#ff8a4a}.ty.Fighting{background:#d9674a}.ty.Ghost{background:#a780d8}.ty.Electric{background:#ffd83a}
.tabs{display:flex;gap:6px}.tabs button{padding:5px 14px}.tabs button.on{background:#1d5b82;border-color:var(--water)}
.body{min-height:150px}.bio{margin:0 0 10px;text-align:left;color:var(--ink);font-size:.9rem}
.sb{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;font-size:.8rem;margin:4px 0}
.sb div{height:8px;background:#0b1620}.sb i{display:block;height:100%;background:var(--water)}
.mv{display:grid;gap:1px;margin-bottom:8px}.mv b{font-size:.75rem;color:var(--muted)}.mv span{font-size:.95rem}.mv small{color:var(--muted);font-size:.8rem}
.fight{padding:10px 18px;background:#1d5b82;border-color:var(--water)}
@media(max-width:720px){.sel{grid-template-columns:1fr}.hd{grid-template-columns:auto 1fr}.hd #pv{display:none}}
